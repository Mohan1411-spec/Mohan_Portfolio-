<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin | Messages</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Inter', sans-serif; background: #0a0a0f; color: #e8e8f0; min-height: 100vh; }
    header {
      background: rgba(255,255,255,0.04); border-bottom: 1px solid rgba(255,255,255,0.08);
      padding: 18px 32px; display: flex; align-items: center; justify-content: space-between;
    }
    header h1 { font-size: 1.2rem; font-weight: 700; background: linear-gradient(135deg,#6c63ff,#00d4ff); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .badge { background: #6c63ff33; color: #6c63ff; padding: 4px 12px; border-radius: 99px; font-size: 0.8rem; font-weight: 600; }
    main { max-width: 900px; margin: 40px auto; padding: 0 24px; }
    .toolbar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 24px; flex-wrap: wrap; gap: 12px; }
    .toolbar input {
      background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.08);
      color: #e8e8f0; padding: 10px 16px; border-radius: 10px; font-family: inherit;
      font-size: 0.85rem; width: 260px; outline: none;
    }
    .toolbar input:focus { border-color: #6c63ff; }
    .btn-refresh {
      background: linear-gradient(135deg,#6c63ff,#00d4ff); color: #fff; border: none;
      padding: 10px 20px; border-radius: 10px; cursor: pointer; font-family: inherit;
      font-size: 0.85rem; font-weight: 600; display: flex; align-items: center; gap: 8px;
    }
    .empty { text-align: center; padding: 80px 0; color: #888899; }
    .empty i { font-size: 3rem; margin-bottom: 16px; display: block; opacity: 0.3; }
    .msg-card {
      background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.08);
      border-radius: 14px; padding: 24px; margin-bottom: 16px; transition: border-color 0.2s;
    }
    .msg-card:hover { border-color: #6c63ff55; }
    .msg-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; margin-bottom: 12px; flex-wrap: wrap; }
    .msg-meta h3 { font-size: 1rem; font-weight: 700; margin-bottom: 4px; }
    .msg-meta span { font-size: 0.8rem; color: #888899; }
    .msg-meta a { color: #6c63ff; text-decoration: none; }
    .msg-meta a:hover { text-decoration: underline; }
    .msg-date { font-size: 0.75rem; color: #888899; white-space: nowrap; }
    .msg-subject { font-size: 0.8rem; font-weight: 600; color: #00d4ff; margin-bottom: 10px; }
    .msg-body { font-size: 0.88rem; color: #aaaabc; line-height: 1.7; white-space: pre-wrap; }
    .msg-actions { display: flex; gap: 10px; margin-top: 14px; }
    .btn-copy, .btn-delete {
      padding: 6px 14px; border-radius: 8px; border: none; cursor: pointer;
      font-family: inherit; font-size: 0.78rem; font-weight: 600; display: flex; align-items: center; gap: 6px;
    }
    .btn-copy { background: rgba(108,99,255,0.15); color: #6c63ff; }
    .btn-copy:hover { background: rgba(108,99,255,0.3); }
    .btn-delete { background: rgba(255,107,107,0.12); color: #ff6b6b; }
    .btn-delete:hover { background: rgba(255,107,107,0.25); }
    #loginWrap {
      display: flex; align-items: center; justify-content: center; min-height: 100vh;
    }
    .login-box {
      background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.08);
      border-radius: 16px; padding: 40px; width: 340px; text-align: center;
    }
    .login-box h2 { margin-bottom: 8px; font-size: 1.3rem; }
    .login-box p { color: #888899; font-size: 0.85rem; margin-bottom: 24px; }
    .login-box input {
      width: 100%; padding: 12px 16px; background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.1); border-radius: 10px;
      color: #e8e8f0; font-family: inherit; font-size: 0.9rem; outline: none; margin-bottom: 12px;
    }
    .login-box input:focus { border-color: #6c63ff; }
    .login-box button {
      width: 100%; padding: 12px; background: linear-gradient(135deg,#6c63ff,#00d4ff);
      color: #fff; border: none; border-radius: 10px; font-family: inherit;
      font-size: 0.95rem; font-weight: 600; cursor: pointer;
    }
    .login-err { color: #ff6b6b; font-size: 0.8rem; margin-top: 8px; }
    #adminWrap { display: none; }
    .stats { display: flex; gap: 16px; margin-bottom: 28px; flex-wrap: wrap; }
    .stat-box {
      background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.08);
      border-radius: 12px; padding: 16px 24px; flex: 1; min-width: 120px;
    }
    .stat-box p { font-size: 0.75rem; color: #888899; margin-bottom: 4px; }
    .stat-box h2 { font-size: 1.8rem; font-weight: 800; background: linear-gradient(135deg,#6c63ff,#00d4ff); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
  </style>
</head>
<body>

  <!-- Login -->
  <div id="loginWrap">
    <div class="login-box">
      <h2>🔐 Admin Panel</h2>
      <p>Enter password to view messages</p>
      <input type="password" id="passInput" placeholder="Password" />
      <button onclick="login()">Login</button>
      <p class="login-err" id="loginErr"></p>
    </div>
  </div>

  <!-- Admin Dashboard -->
  <div id="adminWrap">
    <header>
      <h1><i class="fas fa-inbox"></i> &nbsp;Message Inbox</h1>
      <span class="badge" id="totalBadge">0 messages</span>
    </header>
    <main>
      <div class="stats">
        <div class="stat-box"><p>Total Messages</p><h2 id="statTotal">0</h2></div>
        <div class="stat-box"><p>Today</p><h2 id="statToday">0</h2></div>
        <div class="stat-box"><p>This Week</p><h2 id="statWeek">0</h2></div>
      </div>
      <div class="toolbar">
        <input type="text" id="searchInput" placeholder="🔍  Search by name, email or message..." oninput="renderMessages()" />
        <button class="btn-refresh" onclick="loadMessages()"><i class="fas fa-sync-alt"></i> Refresh</button>
      </div>
      <div id="messagesList"></div>
    </main>
  </div>

  <script>
    const ADMIN_PASS = "mohan@admin123"; // Change this password
    let allMessages = [];

    function login() {
      const val = document.getElementById("passInput").value;
      if (val === ADMIN_PASS) {
        document.getElementById("loginWrap").style.display = "none";
        document.getElementById("adminWrap").style.display = "block";
        loadMessages();
      } else {
        document.getElementById("loginErr").textContent = "Incorrect password.";
      }
    }

    document.getElementById("passInput").addEventListener("keydown", (e) => {
      if (e.key === "Enter") login();
    });

    async function loadMessages() {
      try {
        const res = await fetch("/api/messages");
        const data = await res.json();
        allMessages = data.messages || [];
        updateStats();
        renderMessages();
      } catch {
        document.getElementById("messagesList").innerHTML =
          `<div class="empty"><i class="fas fa-plug"></i><p>Cannot connect to server.<br>Make sure <code>npm start</code> is running.</p></div>`;
      }
    }

    function updateStats() {
      const now = new Date();
      const today = allMessages.filter(m => new Date(m.createdAt).toDateString() === now.toDateString()).length;
      const weekAgo = new Date(now - 7 * 864e5);
      const week = allMessages.filter(m => new Date(m.createdAt) >= weekAgo).length;
      document.getElementById("statTotal").textContent = allMessages.length;
      document.getElementById("statToday").textContent = today;
      document.getElementById("statWeek").textContent = week;
      document.getElementById("totalBadge").textContent = allMessages.length + " message" + (allMessages.length !== 1 ? "s" : "");
    }

    function renderMessages() {
      const q = document.getElementById("searchInput").value.toLowerCase();
      const filtered = allMessages.filter(m =>
        m.name.toLowerCase().includes(q) ||
        m.email.toLowerCase().includes(q) ||
        m.message.toLowerCase().includes(q) ||
        (m.subject || "").toLowerCase().includes(q)
      );
      const list = document.getElementById("messagesList");
      if (!filtered.length) {
        list.innerHTML = `<div class="empty"><i class="fas fa-inbox"></i><p>${q ? "No results found." : "No messages yet."}</p></div>`;
        return;
      }
      list.innerHTML = [...filtered].reverse().map((m, i) => `
        <div class="msg-card" id="card-${m.id}">
          <div class="msg-top">
            <div class="msg-meta">
              <h3><i class="fas fa-user" style="color:#6c63ff;margin-right:6px;font-size:0.85rem"></i>${m.name}</h3>
              <span><a href="mailto:${m.email}">${m.email}</a></span>
            </div>
            <div class="msg-date"><i class="fas fa-clock" style="margin-right:4px"></i>${new Date(m.createdAt).toLocaleString()}</div>
          </div>
          ${m.subject ? `<div class="msg-subject"><i class="fas fa-tag" style="margin-right:6px"></i>${m.subject}</div>` : ""}
          <div class="msg-body">${m.message}</div>
          <div class="msg-actions">
            <button class="btn-copy" onclick="copyEmail('${m.email}')"><i class="fas fa-copy"></i> Copy Email</button>
            <a href="mailto:${m.email}?subject=Re: ${encodeURIComponent(m.subject || 'Your message')}" class="btn-copy" style="text-decoration:none"><i class="fas fa-reply"></i> Reply</a>
            <button class="btn-delete" onclick="deleteMsg(${m.id})"><i class="fas fa-trash"></i> Delete</button>
          </div>
        </div>`).join("");
    }

    function copyEmail(email) {
      navigator.clipboard.writeText(email);
      showToast("Email copied: " + email);
    }

    async function deleteMsg(id) {
      try {
        await fetch("/api/messages/" + id, { method: "DELETE" });
        allMessages = allMessages.filter(m => m.id !== id);
        updateStats();
        renderMessages();
        showToast("Message deleted.");
      } catch {
        allMessages = allMessages.filter(m => m.id !== id);
        updateStats();
        renderMessages();
      }
    }

    function showToast(msg) {
      const t = document.createElement("div");
      t.textContent = msg;
      Object.assign(t.style, {
        position:"fixed", bottom:"24px", right:"24px", background:"#6c63ff",
        color:"#fff", padding:"12px 20px", borderRadius:"10px", fontSize:"0.85rem",
        fontWeight:"600", zIndex:"9999", transition:"opacity 0.3s"
      });
      document.body.appendChild(t);
      setTimeout(() => { t.style.opacity = "0"; setTimeout(() => t.remove(), 300); }, 2500);
    }
  </script>
</body>
</html>
